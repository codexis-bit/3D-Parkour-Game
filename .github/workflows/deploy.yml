# Baut MOMENTUM bei jedem Push auf main, prüft Lint/Format/Tests und veröffentlicht dist/ auf
# GitHub Pages. Pull Requests werden nur geprüft, nicht veröffentlicht.
# Einmalig nötig: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prüfen & bauen
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pages konfigurieren
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build-Ergebnis hochladen
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Auf GitHub Pages veröffentlichen
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v5
